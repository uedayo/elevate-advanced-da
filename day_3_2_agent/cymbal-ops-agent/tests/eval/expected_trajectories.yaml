# Expected tool trajectories, keyed by eval_case_id. Consumed by trajectory_check.py.
#
# steps: ordered list of model turns; each step is the set of tool calls expected
#        in ONE model turn (2+ entries in a step = parallel dispatch required).
# args:  optional {arg_name: regex} that the call's arguments must match.
# mode:  exact  -> every step must appear in order (default)
#        any_of -> at least one of `alternatives` must fully match
#        none   -> no tool call is required (refusal / clarification is acceptable)
# Golden entries (evalset_turn_*) were extracted from the function_call events
# recorded in golden-data.json (instructor reference traces).

cases:
  # ---- golden-data.json --------------------------------------------------
  evalset_turn_1: {steps: [[{tool: pos_troubleshooting_rag_tool, args: {query: "ERR-PAY-4001"}}]]}
  evalset_turn_2: {steps: [[{tool: pos_troubleshooting_rag_tool, args: {query: "ERR-DN-PRNT-24V"}}]]}
  evalset_turn_3: {steps: [[{tool: pos_troubleshooting_rag_tool}]]}
  evalset_turn_4: {steps: [[{tool: cymbal_analytics_tool}]]}
  evalset_turn_5: {steps: [[{tool: cymbal_analytics_tool}]]}
  evalset_turn_6: {steps: [[{tool: read_cashier_realtime_alerts, args: {row_key_prefix: "^STORE_048#CASH_1190$"}}]]}
